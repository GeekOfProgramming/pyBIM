name: Cloudflare Staging Build Validation

on:
  push:
    branches:
      - release/pybim-public-v1

concurrency:
  group: cloudflare-staging-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-worker-build:
    name: Validate OpenNext Cloudflare Worker Build (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Release Commit
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci --include=dev

      - name: Print Toolchain Versions
        run: |
          echo "=== Node & NPM ==="
          node --version
          npm --version
          echo "=== Next.js ==="
          npx next --version
          echo "=== Wrangler ==="
          npx wrangler --version
          echo "=== OpenNext Cloudflare ==="
          npm ls @opennextjs/cloudflare --depth=0

      - name: Build Next.js & OpenNext Cloudflare Worker
        run: |
          npm run build:worker

      - name: Verify Worker Artifacts
        run: |
          echo "=== Checking .open-next/worker.js ==="
          if [ ! -f ".open-next/worker.js" ]; then
            echo "ERROR: .open-next/worker.js was not generated!"
            exit 1
          fi
          ls -lh .open-next/worker.js

          echo "=== Checking .open-next/assets ==="
          if [ ! -d ".open-next/assets" ]; then
            echo "ERROR: .open-next/assets directory was not generated!"
            exit 1
          fi
          echo "Asset count: $(find .open-next/assets -type f | wc -l)"
          du -sh .open-next/assets

      - name: Validate Staging Wrangler Config (Dry Run Check)
        run: |
          echo "=== Validating Staging Configuration (pybim-staging) ==="
          # Check wrangler.jsonc syntax and configuration against staging target
          npx wrangler types --env="" ./wrangler-types.d.ts || true
          # Verify staging configuration references correct entrypoint and assets
          grep -q '"name": "pybim-staging"' wrangler.jsonc || { echo "ERROR: Staging name mismatch"; exit 1; }
          grep -q '"main": ".open-next/worker.js"' wrangler.jsonc || { echo "ERROR: Worker entrypoint mismatch"; exit 1; }
          grep -q '"directory": ".open-next/assets"' wrangler.jsonc || { echo "ERROR: Asset directory mismatch"; exit 1; }
          echo "SUCCESS: Staging Wrangler configuration is aligned with build output."
