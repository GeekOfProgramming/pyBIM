name: Cloudflare Staging Deployment

on:
  push:
    branches:
      - release/pybim-public-v1
  workflow_dispatch:

concurrency:
  group: cloudflare-staging-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-staging-worker:
    name: Deploy to Cloudflare Staging (pybim-staging)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Release Commit
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci --include=dev

      - name: Print Toolchain Versions
        run: |
          echo "=== Node & NPM ==="
          node --version
          npm --version
          echo "=== Next.js ==="
          npx next --version
          echo "=== Wrangler ==="
          npx wrangler --version
          echo "=== OpenNext Cloudflare ==="
          npm ls @opennextjs/cloudflare --depth=0

      - name: Build Next.js & OpenNext Cloudflare Worker
        run: |
          npm run build:worker

      - name: Verify Worker Artifacts
        run: |
          echo "=== Checking .open-next/worker.js ==="
          if [ ! -f ".open-next/worker.js" ]; then
            echo "ERROR: .open-next/worker.js was not generated!"
            exit 1
          fi
          ls -lh .open-next/worker.js

          echo "=== Checking .open-next/assets ==="
          if [ ! -d ".open-next/assets" ]; then
            echo "ERROR: .open-next/assets directory was not generated!"
            exit 1
          fi
          echo "Asset count: $(find .open-next/assets -type f | wc -l)"
          du -sh .open-next/assets

      - name: Verify Staging Guardrails & Configuration
        run: |
          echo "=== Verifying Strict Staging Guardrails ==="
          # 1. Exact Worker name check
          NAME=$(node -e 'const c = JSON.parse(require("fs").readFileSync("wrangler.jsonc","utf8")); console.log(c.name);')
          if [ "$NAME" != "pybim-staging" ]; then
            echo "SAFETY VIOLATION: Worker name is '$NAME', must be 'pybim-staging'!"
            exit 1
          fi

          # 2. workers_dev enabled
          WORKERS_DEV=$(node -e 'const c = JSON.parse(require("fs").readFileSync("wrangler.jsonc","utf8")); console.log(c.workers_dev);')
          if [ "$WORKERS_DEV" != "true" ]; then
            echo "SAFETY VIOLATION: workers_dev is not enabled!"
            exit 1
          fi

          # 3. No production domains or routes
          if grep -iE 'pybim\.com|pybim\.it|"routes"|"domains"' wrangler.jsonc; then
            echo "SAFETY VIOLATION: Production domains or custom routes found in wrangler.jsonc!"
            exit 1
          fi

          # 4. ENVIRONMENT=staging configured
          ENV_VAR=$(node -e 'const c = JSON.parse(require("fs").readFileSync("wrangler.jsonc","utf8")); console.log(c.vars && c.vars.ENVIRONMENT);')
          if [ "$ENV_VAR" != "staging" ]; then
            echo "SAFETY VIOLATION: ENVIRONMENT variable is not set to staging!"
            exit 1
          fi

          # 5. Ensure worker entrypoint and asset directories match OpenNext build
          grep -q '"main": ".open-next/worker.js"' wrangler.jsonc || { echo "SAFETY VIOLATION: Worker main entrypoint mismatch!"; exit 1; }
          grep -q '"directory": ".open-next/assets"' wrangler.jsonc || { echo "SAFETY VIOLATION: Asset directory mismatch!"; exit 1; }

          # 6. Strict confirmation: cannot target production Worker pybim
          if [ "$NAME" = "pybim" ]; then
            echo "CRITICAL ERROR: Production Worker pybim targeted! Aborting."
            exit 1
          fi

          echo "PASS: All staging guardrails verified. Target is strictly pybim-staging on workers.dev."

      - name: Execute Wrangler Dry-Run
        run: |
          echo "=== Executing Wrangler Dry-Run Check ==="
          npx wrangler deploy --dry-run --config wrangler.jsonc
          echo "PASS: Wrangler dry-run completed successfully."

      - name: Deploy to Cloudflare Staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== Deploying to pybim-staging on workers.dev ==="
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN secret is not set in staging environment!"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID secret is not set in staging environment!"
            exit 1
          fi
          npx wrangler deploy --config wrangler.jsonc
          echo "SUCCESS: Staging deployment completed to pybim-staging."

      - name: Confirm Staging Preview Readiness
        run: |
          echo "=========================================================="
          echo "Staging Worker: pybim-staging"
          echo "Preview Domain: workers.dev (e.g. https://pybim-staging.<subdomain>.workers.dev)"
          echo "Robots Header:  X-Robots-Tag: noindex, nofollow (Active)"
          echo "=========================================================="
